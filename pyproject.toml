[project]
name = "cmn-c1-055"
version = "1.1.0"
description = "AgentTaskSpecificationDecompositionAgent -- AgentCore Template (Cat 1, CMN)"
requires-python = ">=3.11"
dependencies = [
    "agenticstar-agentcore[marketplace,openai,platform-rag,platform-memory,platform-db,platform-storage-azure]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# Every node/graph class subclasses a framework base (FunctionNode, AgentBaseGraph)
# whose exact generic parameters are not visible to mypy without the wheel installed
# in every dev environment; disallow_subclassing_any=true (mypy --strict default)
# would fail every node/graph class definition purely on that basis. Confirmed
# pattern from prior template remediations.
disallow_subclassing_any = false

# framework.* / shared.* ship as part of the agenticstar-agentcore wheel but without
# inline type stubs; yaml (pyyaml) also ships without bundled stubs by default.
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "yaml.*"]
ignore_missing_imports = true
